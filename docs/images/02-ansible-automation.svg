<text x="57" y="165" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2F6FAB">AUTOMATION CONTROL FLOW</text><g filter="url(#shadow)"><rect x="70" y="220" width="255" height="90" rx="13" fill="#EAF2FB" stroke="#2F6FAB" stroke-width="2"/></g><text x="197.5" y="261.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#14243A">Administrator</text><text x="197.5" y="288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Starts approved run</text><g filter="url(#shadow)"><rect x="390" y="220" width="255" height="90" rx="13" fill="#EAF2FB" stroke="#2F6FAB" stroke-width="2"/></g><text x="517.5" y="261.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#14243A">Ansible Control</text><text x="517.5" y="288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">SSH-based automation</text><g filter="url(#shadow)"><rect x="710" y="220" width="255" height="90" rx="13" fill="#EAF2FB" stroke="#2F6FAB" stroke-width="2"/></g><text x="837.5" y="261.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#14243A">Inventory</text><text x="837.5" y="288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Hosts grouped by role</text><g filter="url(#shadow)"><rect x="1030" y="220" width="255" height="90" rx="13" fill="#E9F4EC" stroke="#3F865A" stroke-width="2"/></g><text x="1157.5" y="261.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#14243A">Playbooks</text><text x="1157.5" y="288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Reusable automation</text><g filter="url(#shadow)"><rect x="1350" y="220" width="255" height="90" rx="13" fill="#E9F4EC" stroke="#3F865A" stroke-width="2"/></g><text x="1477.5" y="261.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#14243A">Roles</text><text x="1477.5" y="288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Task modules</text><path d="M325 265 L380 265" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><path d="M645 265 L700 265" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><path d="M965 265 L1020 265" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><path d="M1285 265 L1340 265" fill="none" stroke="#718096" stroke-width="3" marker-end="url(#arr)"/><rect x="35" y="380" width="1730" height="205" rx="18" fill="#FFF4D6" fill-opacity=".28" stroke="#B8860B" stroke-width="2" stroke-dasharray="9 7"/>
<text x="57" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#B8860B">TARGET SERVER GROUPS — COMMON BASELINE + ROLE-SPECIFIC TASKS</text><g filter="url(#shadow)"><rect x="65" y="420" width="300" height="82" rx="13" fill="#FFF4D6" stroke="#B8860B" stroke-width="2"/></g><text x="215.0" y="457.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14243A">OS baseline</text><text x="215.0" y="484.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Packages and updates</text><g filter="url(#shadow)"><rect x="400" y="420" width="300" height="82" rx="13" fill="#FFF4D6" stroke="#B8860B" stroke-width="2"/></g><text x="550.0" y="457.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14243A">Networking</text><text x="550.0" y="484.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Hostname and DNS</text><g filter="url(#shadow)"><rect x="735" y="420" width="300" height="82" rx="13" fill="#FFF4D6" stroke="#B8860B" stroke-width="2"/></g><text x="885.0" y="457.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14243A">Time + system</text><text x="885.0" y="484.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Chrony, kernel and limits</text><g filter="url(#shadow)"><rect x="1070" y="420" width="300" height="82" rx="13" fill="#FFF4D6" stroke="#B8860B" stroke-width="2"/></g><text x="1220.0" y="457.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14243A">Security</text><text x="1220.0" y="484.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Firewall and SSH</text><g filter="url(#shadow)"><rect x="1405" y="420" width="300" height="82" rx="13" fill="#FFF4D6" stroke="#B8860B" stroke-width="2"/></g><text x="1555.0" y="457.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#14243A">Prerequisites</text><text x="1555.0" y="484.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Role-specific packages</text><g filter="url(#shadow)"><rect x="65" y="520" width="350" height="50" rx="13" fill="#F0ECF8" stroke="#7255A5" stroke-width="2"/></g><text x="240.0" y="541.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#14243A">Load Balancers</text><text x="240.0" y="568.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">HAProxy / Keepalived</text><g filter="url(#shadow)"><rect x="485" y="520" width="350" height="50" rx="13" fill="#F0ECF8" stroke="#7255A5" stroke-width="2"/></g><text x="660.0" y="541.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#14243A">Control Plane</text><text x="660.0" y="568.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Kubernetes nodes</text><g filter="url(#shadow)"><rect x="905" y="520" width="350" height="50" rx="13" fill="#F0ECF8" stroke="#7255A5" stroke-width="2"/></g><text x="1080.0" y="541.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#14243A">Worker Nodes</text><text x="1080.0" y="568.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">Kubernetes nodes</text><g filter="url(#shadow)"><rect x="1325" y="520" width="350" height="50" rx="13" fill="#F0ECF8" stroke="#7255A5" stroke-width="2"/></g><text x="1500.0" y="541.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#14243A">Backup Server</text><text x="1500.0" y="568.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#536477">MinIO prerequisites</text><text x="65" y="615" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#536477">Validation after each run: package state  •  connectivity  •  required services  •  server readiness</text></svg>