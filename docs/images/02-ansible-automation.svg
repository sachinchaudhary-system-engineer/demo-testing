<text x="48" y="55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#14243A">02  |  ANSIBLE SERVER AUTOMATION</text>
<text x="48" y="88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#536477">One control machine applies reusable configuration to every server group.</text>
