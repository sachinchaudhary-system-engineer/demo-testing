apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-hpa
  namespace: jenkins

spec:
  scaleTargetRef:
   apiVersion: apps/v1
   kind: Deployment
   name: demo-deployment

  maxReplicas: 5
  minReplicas: 1

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 5
